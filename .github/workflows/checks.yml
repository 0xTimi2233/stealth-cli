name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-analysis:
    name: 格式、规范与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run check

  test:
    name: 跨平台测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - name: 缓存 CloakBrowser 内核
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-${{ runner.os }}-145
      - run: bun install --frozen-lockfile
      - run: bun test --bail

  compile:
    name: 独立二进制编译 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: stealth-cli-linux-x64
          - os: macos-latest
            artifact: stealth-cli-darwin-x64
          - os: windows-latest
            artifact: stealth-cli-windows-x64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: 编译独立可执行文件
        shell: bash
        run: |
          mkdir -p dist
          bun build --compile --minify --external playwright-core --external chromium-bidi src/features/cli/cli.ts --outfile dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          retention-days: 7
